name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only: this workflow runs code from pull requests and holds no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks, build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Types and content schemas
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Production content must contain no demo records
        run: npm run check:content
        env:
          SITE_ENV: production
      - name: Build
        run: npm run build
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser tests
        run: npm run test:e2e -- --trace off
