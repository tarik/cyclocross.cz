# DigitalOcean App Platform specification for the production static site.
#
# TEMPLATE ONLY. Nothing is provisioned from this file yet. Before first use,
# verify every key against the current App Platform documentation and get the
# owner's release decision (SPEC.md section 13). It contains no secrets.
name: cyclocross-cz
region: fra
static_sites:
  - name: web
    github:
      repo: tarik/cyclocross.cz
      branch: main
      # Only the protected main branch deploys, so an unreviewed push cannot ship.
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm ci && npm run build
    output_dir: dist
    # A real 404 document. No catch-all rewrite: missing pages must stay missing.
    error_document: 404.html
    envs:
      - key: SITE_ENV
        value: production
        scope: BUILD_TIME
# Domains are added at cutover, after the owner's decision:
